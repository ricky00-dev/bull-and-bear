# PR마다 세 부분을 검사한다. 머지 전에 PR 화면에서 통과 여부를 본다.
# 바뀐 폴더만 돌려 무료 사용량(private 레포 월 2,000분)을 아낀다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      worker: ${{ steps.f.outputs.worker }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'ai-worker/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'api/**'
              - 'web/**'
              - 'ai-worker/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # 통합 테스트는 Testcontainers로 PostgreSQL을 띄운다 (러너에 Docker 있음)
      - run: ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api/build/reports/tests/test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai-worker/uv.lock
      # API 키 없이 돈다. 외부 호출 테스트는 키가 없으면 건너뛴다
      - run: uv sync --frozen --extra rag-postgres
      - run: uv run pytest -q

  # 운영 이미지가 빌드되는지만 본다 (develop에 들어갈 때만, 시간이 오래 걸려서)
  images:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: compose build
        run: |
          printf 'POSTGRES_PASSWORD=ci\nWORKER_TOKEN=ci\n' > /tmp/ci.env
          docker compose -f deploy/compose.yml --env-file /tmp/ci.env --profile worker build
